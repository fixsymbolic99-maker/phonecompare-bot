<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <style>
        /* نفس ألوان الداشبورد الأساسي (أرجواني) */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #0a0a0f; color: #e0e0e0; padding: 2rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { color: #7c3aed; }
        .btn-purple { background: #7c3aed; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; }

        /* شبكة الكروت */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 1rem;
            position: relative;
            transition: 0.2s;
        }
        .card:hover { border-color: #7c3aed40; }
        
        .card-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem; }
        .card-image { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 0.8rem; background: #222; }
        
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.2rem; }
        .card-price { color: #7c3aed; font-size: 1.1rem; font-weight: bold; }
        .card-meta { color: #888; font-size: 0.8rem; }

        /* القائمة المنسدلة للنقاط الثلاث */
        .more-btn {
            background: transparent; border: none; color: #888; font-size: 1.5rem; cursor: pointer; padding: 0 4px;
        }
        .dropdown {
            position: absolute; right: 0; top: 2rem;
            background: #1f1f1f; border: 1px solid #333; border-radius: 8px;
            display: none; flex-direction: column; min-width: 150px; z-index: 10;
        }
        .dropdown.active { display: flex; }
        .dropdown-item {
            padding: 0.6rem 1rem; cursor: pointer; font-size: 0.9rem; color: #ccc; transition: 0.1s;
        }
        .dropdown-item:hover { background: #333; color: #fff; }
        .dropdown-item.danger { color: #ff4444; }

        /* المودال (Modal) */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #141414; border: 1px solid #333; border-radius: 16px;
            padding: 2rem; max-width: 450px; width: 90%;
        }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .modal-title { font-size: 1.2rem; font-weight: 600; }
        .modal-close { background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #888; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.6rem; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff;
        }
        .form-group input:focus { border-color: #7c3aed; outline: none; }
        .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }

        .btn-secondary { background: #333; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: #7c3aed; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; }

        /* تنسيق الصور في القائمة المنسدلة للاختيار */
        .image-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin: 4px; cursor: pointer; border: 2px solid transparent; }
        .image-preview.selected { border-color: #7c3aed; }
        .image-select-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; max-height: 150px; overflow-y: auto; }

        /* لمسات نهائية */
        .status-badge { padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; background: #1f1f1f; color: #888; }
        .status-badge.active { background: #7c3aed20; color: #7c3aed; border: 1px solid #7c3aed40; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 إدارة المنتجات</h1>
        <button class="btn-purple" onclick="alert('ستضيف هنا منتج جديد لاحقاً')">+ إضافة منتج</button>
    </div>
    <div id="products-grid" class="grid">
        <!-- سيتم تعبئتها بواسطة JS -->
    </div>

    <!-- مودال التعديل -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">تعديل المنتج</span>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label>السعر (USD)</label>
                    <input type="number" id="edit-price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>المميزات</label>
                    <textarea id="edit-features" rows="2" placeholder="مواصفات سريعة..."></textarea>
                </div>
                <div class="form-group">
                    <label>اختر صورة (من مجلد images)</label>
                    <div id="image-selector" class="image-select-grid">
                        <!-- سيتم تعبئتها بالصور -->
                    </div>
                    <small style="color:#666;">انقر على الصورة لاختيارها (يجب رفعها مسبقاً على GitHub).</small>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn-primary">حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. إعدادات الاتصال
        const BACKEND_URL = window.location.origin;
        let token = localStorage.getItem('token');
        if (!token) {
            // إذا لم يسجل دخول، نوجهه لتسجيل الدخول
            window.location.href = '/';
        }

        // 2. دوال مساعدة
        async function apiRequest(endpoint, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(`${BACKEND_URL}${endpoint}`, options);
            if (res.status === 401) { localStorage.removeItem('token'); window.location.reload(); }
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        // 3. تحميل البيانات وعرض الكروت
        async function loadProducts() {
            try {
                const products = await apiRequest('/api/products');
                const images = await apiRequest('/api/images');
                
                const grid = document.getElementById('products-grid');
                grid.innerHTML = '';

                products.forEach((product, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    // الترتيب: نضيف حقل order لاحقاً، حالياً سنفترض أن الترتيب هو حسب المصفوفة
                    card.style.order = index; 

                    // صورة افتراضية لو مفيش صورة مختارة
                    const imgSrc = product.image && images.includes(product.image) 
                        ? `${BACKEND_URL}/images/${product.image}` 
                        : 'https://via.placeholder.com/200x140?text=No+Image';

                    card.innerHTML = `
                        <div class="card-top">
                            <span class="status-badge active">مقارن</span>
                            <div style="position:relative;">
                                <button class="more-btn" onclick="toggleDropdown('${product._id}')">⋮</button>
                                <div class="dropdown" id="dropdown-${product._id}">
                                    <div class="dropdown-item" onclick="openInfo('${product._id}')">المعلومات</div>
                                    <div class="dropdown-item" onclick="openEdit('${product._id}')">تعديل</div>
                                    <div class="dropdown-item danger" onclick="deleteProduct('${product._id}')">حذف</div>
                                    <div class="dropdown-item" onclick="rePublish('${product._id}')">إعادة نشر</div>
                                    <div class="dropdown-item" onclick="reorder('${product._id}', 'up')">نقل لأعلى</div>
                                    <div class="dropdown-item" onclick="reorder('${product._id}', 'down')">نقل لأسفل</div>
                                </div>
                            </div>
                        </div>
                        <img src="${imgSrc}" class="card-image" alt="${product.name}">
                        <div class="card-title">${product.name}</div>
                        <div class="card-price">${product.currency || 'USD'} ${product.price}</div>
                        <div class="card-meta">آخر تحديث: ${new Date(product.lastUpdated).toLocaleTimeString()}</div>
                    `;
                    grid.appendChild(card);
                });

                // تخزين قائمة الصور لعرضها في المودال
                window._imagesList = images;

            } catch (err) {
                console.error(err);
                alert('فشل تحميل البيانات');
            }
        }

        // 4. التحكم في القائمة المنسدلة
        function toggleDropdown(id) {
            const menu = document.getElementById(`dropdown-${id}`);
            const isOpen = menu.classList.contains('active');
            // إغلاق كل القوائم المفتوحة
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
            if (!isOpen) menu.classList.add('active');
        }
        // إغلاق القائمة عند الضغط في أي مكان
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.more-btn')) {
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
            }
        });

        // 5. فتح مودال التعديل
        async function openEdit(id) {
            const products = await apiRequest('/api/products');
            const product = products.find(p => p._id === id);
            if (!product) return;

            document.getElementById('edit-id').value = product._id;
            document.getElementById('edit-name').value = product.name;
            document.getElementById('edit-price').value = product.price;
            document.getElementById('edit-features').value = product.features || '';

            // تعبئة صندوق اختيار الصور
            const selector = document.getElementById('image-selector');
            selector.innerHTML = '';
            window._imagesList.forEach(img => {
                const imgEl = document.createElement('img');
                imgEl.src = `${BACKEND_URL}/images/${img}`;
                imgEl.className = `image-preview ${product.image === img ? 'selected' : ''}`;
                imgEl.onclick = () => {
                    document.querySelectorAll('.image-preview').forEach(i => i.classList.remove('selected'));
                    imgEl.classList.add('selected');
                    // تخزين الاسم المختار في حقل مخفي أو متغير
                    document.getElementById('edit-id').dataset.selectedImage = img;
                };
                selector.appendChild(imgEl);
            });

            document.getElementById('edit-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        // 6. حفظ التعديلات
        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const price = parseFloat(document.getElementById('edit-price').value);
            const features = document.getElementById('edit-features').value;
            // الصورة المختارة
            const selectedImg = document.getElementById('edit-id').dataset.selectedImage || 
                               document.querySelector('.image-preview.selected')?.src.split('/').pop();

            try {
                await apiRequest(`/api/products/${id}`, 'PUT', { name, price, features, image: selectedImg });
                closeModal();
                loadProducts();
                alert('تم تحديث المنتج بنجاح!');
            } catch (err) {
                alert('خطأ في الحفظ: ' + err.message);
            }
        });

        // 7. حذف منتج
        async function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            try {
                await apiRequest(`/api/products/${id}`, 'DELETE');
                loadProducts();
            } catch (err) { alert(err.message); }
        }

        // 8. إعادة نشر (تشغيل زحف فوري)
        async function rePublish(id) {
            const store = prompt('اكتب اسم المتجر للزحف (مثلاً amazon) أو اتركه فارغاً للكل:');
            try {
                // سنقوم باستخدام endpoint الزحف الموجود
                const endpoint = store ? `/api/proxy/start/${store}` : '/api/proxy/start-all';
                await apiRequest(endpoint, 'POST');
                alert('تم بدء الزحف');
            } catch (err) { alert(err.message); }
        }

        // 9. تغيير الترتيب (مبدئياً سنعيد تحميل الصفحة)
        async function reorder(id, direction) {
            alert('سيتم تنفيذ ميزة الترتيب لاحقاً. سيتم إعادة تحميل البيانات.');
            loadProducts();
        }

        // بدء التطبيق
        loadProducts();

        // إغلاق المودال عند الضغط على الخلفية
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
    </script>
</body>
</html>
